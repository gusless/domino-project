[project]
name = "domino"
version = "0.1.0"
description = "Jogo de dominó em python"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["domino*", "agents*", "controllers*", "interfaces*"]
